<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciar Resíduos — BioGas Analytics</title>
  <link rel="stylesheet" href="../../_common/styles/base.css">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body>
  <header class="admin-header">
    <nav class="admin-topbar">
      <a class="admin-brand" href="dashboard.html"><h1 class="logo">Resíduos</h1></a>
    </nav>
  </header>

  <main class="admin-main">
    <nav class="admin-sidebar" aria-label="Admin navigation">
      <ul class="admin-nav">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="users.html">Usuários</a></li>
        <li><a href="admins.html">Administradores</a></li>
        <li><a href="wastes.html" class="active">Resíduos</a></li>
        <li><a href="params.html">Parâmetros</a></li>
        <li><a href="faqs.html">FAQs</a></li>
        <li><a href="reports.html">Relatórios</a></li>
      </ul>
    </nav>

    <section class="admin-content">
      <section class="admin-card">
        <header class="section-actions">
          <h2>Gerenciar tipos de resíduo</h2>
          <button id="create-waste" class="btn btn-primary">Criar Resíduo</button>
        </header>
        <table class="management-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Rendimento</th>
              <th>Criado</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="wastes-body"></tbody>
        </table>
      </section>

      <section id="waste-details" class="admin-card">
        <h3>Detalhes do resíduo</h3>
        <p>Selecione um resíduo para ver detalhes.</p>
      </section>

      <section id="waste-modal" class="modal hidden" role="dialog" aria-modal="true">
        <section class="modal-box">
          <header class="modal-header">
            <h3 id="waste-modal-title">Criar Resíduo</h3>
            <button type="button" data-close="waste-modal" class="btn btn-secondary">Fechar</button>
          </header>
          <form id="waste-form">
            <fieldset>
              <label>Nome<input id="waste-name" name="name" placeholder="Ex: Resíduo Alimentar" required></label>
              <label>Descrição<textarea id="waste-description" name="description" required></textarea></label>
              <label>Rendimento estimado (m³/kg)<input id="waste-yield" name="estimated_yield" type="number" step="0.0001" min="0.0001" max="999999.9999" required></label>
              <footer class="modal-actions">
                <button type="button" class="btn btn-secondary" data-close="waste-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
              </footer>
            </fieldset>
          </form>
        </section>
      </section>
    </section>
  </main>
  <script type="module" src="../scripts/admin.js"></script>
</body>
</html>
